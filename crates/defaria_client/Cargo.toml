[package]
name = "defaria_client"
description = "How the game is shown and played: rendering, UI and input."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bevy = { workspace = true }
defaria_core = { workspace = true }
# Mods' client scripts, in the runtime core has.
mlua = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
defaria_core = { workspace = true, features = ["test-support"] }
# Only for tests that run the server's systems beside the client's (the
# world streamed or generated, scripts, mining): the client itself never
# depends on the server.
defaria_server = { workspace = true, features = ["test-support"] }

[features]
# The same Bevy features as the game's `dev` (see the root Cargo.toml), so
# this crate built on its own shares the one compiled Bevy.
default = ["dev"]
dev = [
    "bevy/dynamic_linking",
    "bevy/dev",
    "bevy/bevy_remote",
    "defaria_core/dev",
]
# Test helpers (`meshing::testing`) for other crates' tests.
test-support = ["defaria_core/test-support"]

[lib]
# Doctests don't work with `bevy/dynamic_linking` (the dylib isn't on the
# loader path), so keep examples in #[test] functions instead.
doctest = false

[lints]
workspace = true
