name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI builds once from scratch; incremental artifacts only cost time and cache space.
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all -- --check

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bevy's Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      # Cache Bevy's build. The key changes only with the toolchain or the
      # lockfile; when it misses, the restore keys fall back to the newest cache
      # for the same toolchain, which still has nearly every dependency built.
      # (Swatinem/rust-cache hashes Cargo.toml and .cargo/config.toml into the
      # part of its key that must match exactly, so any edit to them meant a
      # cold ~30 minute build.)
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Clippy (dev features)
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Clippy (shipping features)
        run: cargo clippy --all-targets --locked --no-default-features -- -D warnings
      - name: Test
        run: cargo test --locked
      # No GPU on CI runners: run every scenario without rendering. This catches
      # scripts that no longer parse, unknown components and crashes, not visual
      # problems.
      - name: Scenarios
        run: |
          for script in scenarios/*.txt; do
            echo "::group::$script"
            cargo run --locked -- --headless "$script" --no-render
            echo "::endgroup::"
          done
