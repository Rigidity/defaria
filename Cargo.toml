[package]
name = "defaria"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[workspace]
members = ["crates/defaria_core", "crates/defaria_client", "crates/defaria_server"]
# Plain `cargo build`, `test`, `clippy` and `check` cover every crate.
default-members = [".", "crates/defaria_core", "crates/defaria_client", "crates/defaria_server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

# Every crate takes these from here, so they're one version, built once.
[workspace.dependencies]
# `serialize`: the messages between client and server carry Bevy types
# (`Transform`, vectors). Dev builds have it through `bevy_remote` already.
bevy = { version = "0.20.1", features = ["serialize"] }
defaria_core = { path = "crates/defaria_core", default-features = false }
defaria_client = { path = "crates/defaria_client", default-features = false }
defaria_server = { path = "crates/defaria_server", default-features = false }
json5 = "1.3.8"
# zlib for saved chunks. The version Bevy already builds (for PNGs).
miniz_oxide = "0.8.9"
# Mod scripts run in Luau. Its C++ source is built once and linked in
# statically, so shipping builds stay one binary (see docs/decisions.md).
mlua = { version = "0.12.3", features = ["luau", "send"] }
serde = { version = "1.0.229", features = ["derive"] }
# The messages between server and client, encoded for the network.
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
# Compile out verbose log calls (including Bevy's own) at build time.
# Debug builds keep up to `debug`; release builds keep only `warn` and `error`.
tracing = { version = "0.1", features = ["max_level_debug", "release_max_level_warn"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# Bevy systems routinely trip these; they're noise, not bugs.
type_complexity = "allow"
too_many_arguments = "allow"

[dependencies]
bevy = { workspace = true }
defaria_core = { workspace = true }
defaria_client = { workspace = true }
defaria_server = { workspace = true }
tracing = { workspace = true }

# The headless runner's per-system CPU clock (`systems`): the version, and
# the features, Bevy already builds.
# The network: QUIC on async-io (which Bevy's assets already build), with
# rustls on ring, and the server's self-signed certificate from rcgen.
quinn = { version = "0.11", default-features = false, features = ["runtime-smol", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
smol = "2"
bytes = "1"
miniz_oxide = { workspace = true }
serde = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1.1.6", default-features = false, features = ["time"] }

[dev-dependencies]
defaria_core = { workspace = true, features = ["test-support"] }
defaria_client = { workspace = true, features = ["test-support"] }
defaria_server = { workspace = true, features = ["test-support"] }

[features]
# `dev` is on by default so that `cargo run`, `test`, `clippy` and `check` all
# share ONE compiled copy of Bevy. Different feature sets mean a second full
# Bevy build, so every crate's `dev` turns on the same Bevy features (and
# `cargo test -p <crate>` on its own builds the same Bevy as the rest). Only
# `cargo dist` (see .cargo/config.toml) turns it off.
# Never ship with it: dynamic linking needs libbevy_dylib next to the binary.
default = ["dev"]
dev = [
    "bevy/dynamic_linking", # biggest win for incremental compiles
    "bevy/dev",             # asset hot reloading + debug tooling
    "bevy/bevy_remote",     # Bevy Remote Protocol: inspect the running game over HTTP
    "defaria_core/dev",
    "defaria_client/dev",
    "defaria_server/dev",
]

[lib]
# Doctests don't work with `bevy/dynamic_linking` (the dylib isn't on the
# loader path), so keep examples in #[test] functions instead.
doctest = false

[lints]
workspace = true

# Small optimization for our own code keeps debug builds playable
# without slowing incremental rebuilds much.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

# Dependencies (Bevy) are compiled once, so optimize them fully.
[profile.dev.package."*"]
opt-level = 3
debug = false

# CI only (`--profile ci`): no debug info, and Bevy optimized just enough
# (opt-level 1). Tests and scenarios run the whole engine for thousands of
# frames, and with an unoptimized Bevy they took most of CI's time. Builds
# into target/ci/, so it never invalidates local dev builds. CI's cache keys
# name this opt-level: change them together.
[profile.ci]
inherits = "dev"
debug = false

[profile.ci.package."*"]
opt-level = 1

[profile.release]
codegen-units = 1
lto = "thin"

# Shipping build: `cargo build --profile dist`
[profile.dist]
inherits = "release"
lto = "fat"
strip = true
panic = "abort"
